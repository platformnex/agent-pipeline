name: "Reusable: 3. Implement"

# Reusable workflow, called from each consumer repo's issues (labeled) caller.
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      GH_AUTOMATION_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  implement:
    if: github.event.label.name == 'status:ready-for-dev'
    runs-on: ubuntu-latest
    steps:
      # Checked out with the automation token (not GITHUB_TOKEN) so the PR
      # this job opens actually fires 04-agent-test.yml's pull_request trigger.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_AUTOMATION_TOKEN }}
          fetch-depth: 0

      - name: Create working branch
        run: |
          git checkout -b "agent/issue-${{ github.event.issue.number }}"

      - name: Run Coder agent
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        with:
          allowed_bots: "claude[bot]"
          prompt: |
            You are the CODER agent in an automated spec-driven development pipeline.
            You have no memory of prior steps — reconstruct context yourself:

            1. `gh issue view ${{ github.event.issue.number }} --comments` to read the
               original spec AND the Planner agent's most recent "## Plan (v<n>)" comment.
            2. Read `.claude/pipeline.config.yml` for install/build/test commands,
               protected_paths, and an optional `guardrails` section — never touch
               protected_paths, and treat every listed guardrail as a hard constraint,
               not a suggestion.

            Implement every task in the plan's "Tasks" section on this branch
            (`agent/issue-${{ github.event.issue.number }}`, already checked out).
            Run the install/build commands from pipeline.config.yml as you go to catch
            errors early. Write tests for new behavior — don't leave that entirely to
            the Tester agent downstream.

            Commit after finishing each task (`git add -A && git commit -m "..."`)
            instead of saving one big commit for the end. If you run out of turns
            before finishing every task, whatever you've already committed survives
            and can be picked up from — don't leave completed work uncommitted.

            When implementation is complete:
              git add -A
              git commit -m "..."
              git push -u origin agent/issue-${{ github.event.issue.number }}
              gh pr create --title "..." --body "Closes #${{ github.event.issue.number }}

              Implements the approved plan from #${{ github.event.issue.number }}." \
                --label "agent-generated"

            Then update the issue:
              gh issue edit ${{ github.event.issue.number }} --remove-label "status:ready-for-dev" --add-label "status:in-review"

            If the plan is unimplementable as written (missing info, contradictions),
            OR if implementing it as written would require violating a guardrail from
            pipeline.config.yml, do NOT guess and do NOT work around the guardrail —
            instead comment on the issue explaining exactly what's blocking you (naming
            the specific guardrail if that's the reason), add label "status:plan-review"
            back, and stop without opening a PR.
          claude_args: |
            --allowedTools "Read,Write,Edit,Bash,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(git:*)"
            --max-turns 60

      # Runs only if the Coder step above failed (e.g. hit --max-turns without
      # opening a PR). Without this, the issue is left on status:ready-for-dev
      # with no comment and no label change — just a red Action run a human
      # has to notice on their own.
      - name: Handle Coder failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        run: |
          git push -u origin "agent/issue-${{ github.event.issue.number }}" || true
          gh issue comment ${{ github.event.issue.number }} --body "Coder agent did not finish (see the Action run for details — likely hit \`--max-turns\`). Any completed tasks it committed before stopping were pushed to \`agent/issue-${{ github.event.issue.number }}\`, but no PR was opened. Needs a human to continue the branch manually, or the plan split into smaller issues."
          gh issue edit ${{ github.event.issue.number }} --remove-label "status:ready-for-dev" --add-label "status:plan-review"

name: "Reusable: 3. Implement"

# Reusable workflow, called from each consumer repo's issues (labeled) caller.
on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      GH_AUTOMATION_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  implement:
    if: github.event.label.name == 'status:ready-for-dev'
    runs-on: ubuntu-latest
    steps:
      # Checked out with the automation token (not GITHUB_TOKEN) so the PR
      # this job opens actually fires 04-agent-test.yml's pull_request trigger.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_AUTOMATION_TOKEN }}
          fetch-depth: 0

      - name: Create working branch
        run: |
          git checkout -b "agent/issue-${{ github.event.issue.number }}"

      - name: Run Coder agent
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        with:
          prompt: |
            You are the CODER agent in an automated spec-driven development pipeline.
            You have no memory of prior steps — reconstruct context yourself:

            1. `gh issue view ${{ github.event.issue.number }} --comments` to read the
               original spec AND the Planner agent's most recent "## Plan (v<n>)" comment.
            2. Read `.claude/pipeline.config.yml` for install/build/test commands and
               protected_paths — never touch protected_paths.

            Implement every task in the plan's "Tasks" section on this branch
            (`agent/issue-${{ github.event.issue.number }}`, already checked out).
            Run the install/build commands from pipeline.config.yml as you go to catch
            errors early. Write tests for new behavior — don't leave that entirely to
            the Tester agent downstream.

            When implementation is complete:
              git add -A
              git commit -m "..."
              git push -u origin agent/issue-${{ github.event.issue.number }}
              gh pr create --title "..." --body "Closes #${{ github.event.issue.number }}

              Implements the approved plan from #${{ github.event.issue.number }}." \
                --label "agent-generated"

            Then update the issue:
              gh issue edit ${{ github.event.issue.number }} --remove-label "status:ready-for-dev" --add-label "status:in-review"

            If the plan is unimplementable as written (missing info, contradictions),
            do NOT guess — instead comment on the issue explaining what's blocking you,
            add label "status:plan-review" back, and stop without opening a PR.
          claude_args: |
            --allowedTools "Read,Write,Edit,Bash,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(git:*)"
            --max-turns 40

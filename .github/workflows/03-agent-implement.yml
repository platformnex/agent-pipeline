name: "Reusable: 3. Implement"

# Reusable workflow, called from each consumer repo's issues (labeled) caller.
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      GH_AUTOMATION_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  implement:
    if: >
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'status:ready-for-dev') ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.issue.labels.*.name, 'status:coder-incomplete') &&
       startsWith(github.event.comment.body, '/continue') &&
       github.event.sender.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      # Checked out with the automation token (not GITHUB_TOKEN) so the PR
      # this job opens actually fires 04-agent-test.yml's pull_request trigger.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_AUTOMATION_TOKEN }}
          fetch-depth: 0

      # issue_comment fires for anyone who can comment, unlike the labeled
      # event (which already requires write/triage access to apply a label).
      # Gate /continue the same way 02-agent-plan-approval.yml gates /approve-plan.
      - name: Verify commenter has write access
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          level=$(gh api repos/${{ github.repository }}/collaborators/${{ github.event.comment.user.login }}/permission --jq .permission)
          echo "level=$level"
          if [[ "$level" != "admin" && "$level" != "write" ]]; then
            echo "Commenter lacks write access ($level); ignoring /continue."
            exit 1
          fi

      - name: Create or resume working branch
        run: |
          BRANCH="agent/issue-${{ github.event.issue.number }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists on origin — resuming a previous run."
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
          else
            echo "Branch $BRANCH doesn't exist yet — starting fresh."
            git checkout -b "$BRANCH"
          fi

      - name: Run Coder agent
        id: coder
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        with:
          allowed_bots: "claude[bot]"
          prompt: |
            You are the CODER agent in an automated spec-driven development pipeline.
            You have no memory of prior steps — reconstruct context yourself:

            1. `gh issue view ${{ github.event.issue.number }} --comments` to read the
               original spec AND the Planner agent's most recent "## Plan (v<n>)" comment.
            2. Read `.claude/pipeline.config.yml` for install/build/test commands,
               protected_paths, and an optional `guardrails` section — never touch
               protected_paths, and treat every listed guardrail as a hard constraint,
               not a suggestion.
            3. `git log --oneline main..HEAD` on this branch (`agent/issue-${{ github.event.issue.number }}`,
               already checked out). If this is a fresh run there will be nothing here.
               If it's non-empty, a previous Coder run already made progress and ran out
               of turns before finishing — read those commits (and `git diff main..HEAD`
               if needed) to see which plan tasks are already done, and continue with
               what's left. Don't redo or re-review already-committed work turn-for-turn.

            Implement every task in the plan's "Tasks" section on this branch.
            Run the install/build commands from pipeline.config.yml as you go to catch
            errors early. Write tests for new behavior — don't leave that entirely to
            the Tester agent downstream.

            Commit after finishing each task (`git add -A && git commit -m "..."`)
            instead of saving one big commit for the end. If you run out of turns
            before finishing every task, whatever you've already committed survives
            and can be picked up from — don't leave completed work uncommitted.

            When implementation is complete:
              git add -A
              git commit -m "..."
              git push -u origin agent/issue-${{ github.event.issue.number }}
              gh pr create --title "..." --body "Closes #${{ github.event.issue.number }}

              Implements the approved plan from #${{ github.event.issue.number }}." \
                --label "agent-generated"

            Then update the issue:
              gh issue edit ${{ github.event.issue.number }} --remove-label "status:ready-for-dev" --remove-label "status:coder-incomplete" --add-label "status:in-review"

            If the plan is unimplementable as written (missing info, contradictions),
            OR if implementing it as written would require violating a guardrail from
            pipeline.config.yml, do NOT guess and do NOT work around the guardrail —
            instead comment on the issue explaining exactly what's blocking you (naming
            the specific guardrail if that's the reason), then:
              gh issue edit ${{ github.event.issue.number }} --remove-label "status:ready-for-dev" --remove-label "status:coder-incomplete" --add-label "status:plan-review"
            and stop without opening a PR.
          claude_args: |
            --allowedTools "Read,Write,Edit,Bash,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(git:*)"
            --max-turns 60

      # Runs only if the Coder step itself failed (e.g. hit --max-turns without
      # opening a PR) — checked via steps.coder.conclusion, not a bare failure(),
      # so an unauthorized /continue rejected by the permission check above
      # doesn't also trigger this and misreport that the Coder ran. Without this
      # step, a genuine Coder failure leaves the issue on status:ready-for-dev
      # with no comment and no label change — just a red Action run a human has
      # to notice on their own. status:coder-incomplete is what /continue (above,
      # in this same job's `if:`) looks for to re-run the Coder on the same
      # branch, picking up from whatever got committed.
      - name: Handle Coder failure
        if: failure() && steps.coder.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        run: |
          # claude-code-action reconfigures (and then revokes) its own git
          # credential for the Coder step's use, leaving this step's `git push`
          # with a dead token even though GH_TOKEN above is fine for `gh` calls.
          # Re-point git's credential helper at GH_AUTOMATION_TOKEN explicitly.
          gh auth setup-git
          git push -u origin "agent/issue-${{ github.event.issue.number }}" || true
          gh issue comment ${{ github.event.issue.number }} --body "Coder agent did not finish (see the Action run for details — likely hit \`--max-turns\`). Any completed tasks it committed before stopping were pushed to \`agent/issue-${{ github.event.issue.number }}\`, but no PR was opened. Comment \`/continue\` to resume the Coder on the same branch from where it left off, or split the plan into smaller issues manually."
          gh issue edit ${{ github.event.issue.number }} --remove-label "status:ready-for-dev" --add-label "status:coder-incomplete"

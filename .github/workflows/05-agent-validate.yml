name: "Reusable: 5. Validate"

# Reusable workflow, called from each consumer repo's pull_request (labeled) caller.
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      GH_AUTOMATION_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    if: github.event.label.name == 'status:tests-passed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Run Validator agent
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        with:
          prompt: |
            You are the VALIDATOR agent — the final quality gate before a human is asked
            to merge PR #${{ github.event.pull_request.number }}. You did not write this
            code; review it with fresh, skeptical eyes.

            1. Find the linked issue (look for "Closes #<n>" in the PR body) and read its
               original "Acceptance Criteria" section plus the Planner's plan comment.
            2. Read `.claude/pipeline.config.yml` and run build + lint. Both must be clean.
            3. Review the diff (`gh pr diff ${{ github.event.pull_request.number }}`) for:
               - Every acceptance criterion actually met (not just plausibly addressed)
               - Correctness: concrete inputs that would break the implementation
               - Security: injection, secrets, unvalidated input at trust boundaries
               - Unnecessary complexity, dead code, or scope creep beyond the plan
            4. Do not fix issues yourself — this is a review gate, not another coding pass.

            If everything holds up:
              gh pr review ${{ github.event.pull_request.number }} --approve --body "Acceptance criteria verified: ...\nBuild/lint clean."
              gh pr edit ${{ github.event.pull_request.number }} --remove-label "status:tests-passed" --add-label "status:ready-to-merge"
              gh issue comment <linked-issue-number> --body "Validator approved PR #${{ github.event.pull_request.number }}. Ready for human merge."

            If something is wrong:
              gh pr review ${{ github.event.pull_request.number }} --request-changes --body "<specific, actionable findings, one per line>"
              gh pr edit ${{ github.event.pull_request.number }} --remove-label "status:tests-passed" --add-label "status:changes-requested"
          claude_args: |
            --allowedTools "Read,Bash"
            --max-turns 20

name: "Reusable: 6. Close Out"

# Reusable workflow, called from each consumer repo's pull_request (closed) caller.
# Fires when a human merges the PR (a human action, so the default GITHUB_TOKEN
# triggering the caller is fine — nothing downstream needs to react to this one).
# No Claude call needed here: syncing status is deterministic bookkeeping.
on:
  workflow_call:
    secrets:
      GH_AUTOMATION_TOKEN:
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-out:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'agent-generated')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Extract linked issue number
        id: issue
        run: |
          number=$(echo '${{ github.event.pull_request.body }}' | grep -oiE '(closes|fixes|resolves) #[0-9]+' | grep -oE '[0-9]+' | head -1)
          if [ -z "$number" ]; then
            echo "No linked issue found in PR body via Closes/Fixes/Resolves — skipping Projects sync."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "number=$number" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment final summary on issue
        if: steps.issue.outputs.found == 'true'
        run: |
          gh issue comment ${{ steps.issue.outputs.number }} --body \
            "PR #${{ github.event.pull_request.number }} merged. This closes out the agent pipeline for this spec."

      # Requires repo variables PROJECT_OWNER (user or org login) and
      # PROJECT_NUMBER (the Projects v2 board number, visible in its URL),
      # plus a status field/option named to match below. See README.
      - name: Sync GitHub Projects v2 status field to Done
        if: steps.issue.outputs.found == 'true' && vars.PROJECT_NUMBER != ''
        run: |
          set -e
          owner="${{ vars.PROJECT_OWNER }}"
          project_number="${{ vars.PROJECT_NUMBER }}"
          status_field_name="${{ vars.PROJECT_STATUS_FIELD_NAME || 'Status' }}"
          done_option_name="${{ vars.PROJECT_DONE_OPTION_NAME || 'Done' }}"

          project_id=$(gh project view "$project_number" --owner "$owner" --format json --jq .id)

          item_id=$(gh project item-list "$project_number" --owner "$owner" --format json \
            --jq ".items[] | select(.content.number == ${{ steps.issue.outputs.number }}) | .id")

          if [ -z "$item_id" ]; then
            echo "Issue is not on project #$project_number (owner: $owner) — skipping."
            exit 0
          fi

          gh project item-edit \
            --project-id "$project_id" \
            --id "$item_id" \
            --field-id "$(gh project field-list "$project_number" --owner "$owner" --format json --jq ".fields[] | select(.name == \"$status_field_name\") | .id")" \
            --single-select-option-id "$(gh project field-list "$project_number" --owner "$owner" --format json --jq ".fields[] | select(.name == \"$status_field_name\") | .options[] | select(.name == \"$done_option_name\") | .id")"

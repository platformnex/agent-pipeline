# CALLER workflow — copy into a consumer repo as-is.
# Replace platformnex/agent-pipeline with this hub repo's actual path once pushed.
name: "Agent Pipeline: 1. Plan"

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  call:
    if: >
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'status:needs-plan')) ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.issue.labels.*.name, 'status:plan-review') &&
       startsWith(github.event.comment.body, '/revise-plan') &&
       github.event.sender.login != 'github-actions[bot]')
    uses: platformnex/agent-pipeline/.github/workflows/01-agent-plan.yml@main
    secrets: inherit

# CALLER workflow — copy into a consumer repo as-is.
# Replace platformnex/agent-pipeline with this hub repo's actual path once pushed.
name: "Agent Pipeline: 4. Test"

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  call:
    if: contains(github.event.pull_request.labels.*.name, 'agent-generated')
    uses: platformnex/agent-pipeline/.github/workflows/04-agent-test.yml@main
    secrets: inherit
